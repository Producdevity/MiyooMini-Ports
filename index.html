<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miyoo Mini Ports</title>
    <link rel="stylesheet" href="/style.css" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header>
      <div class="wrap">
        <p class="kicker">Catalog · SigmaStar SSD202D</p>
        <h1>Miyoo Mini<br />Ports</h1>
        <div class="header-sub">
          <p>
            For the Miyoo Mini, Mini Plus, and Mini Flip. Everything here is
            outside
            <a href="https://github.com/OnionUI/Ports-Collection">Onion's Ports-Collection</a>.
          </p>
          <a class="nav-link" href="./porters.html">Porters →</a>
          <button
            id="theme-toggle"
            class="chip theme-toggle"
            type="button"
            aria-label="Switch color theme"
          >
            Dark
          </button>
        </div>
      </div>
    </header>

    <div class="bar">
      <div class="wrap bar-inner">
        <label class="sr-only" for="search">Search ports</label>
        <input id="search" type="search" placeholder="Search ports" autocomplete="off" />
        <span id="count" class="count" aria-live="polite"></span>
      </div>
    </div>
    <div class="wrap chips-row" id="chips"></div>
    <main class="wrap" id="main"></main>
    <footer class="site-footer">
      <div class="wrap">
        <p>
          Each port links to its own releases and setup instructions.
        </p>
        <p>
          <a href="https://github.com/Producdevity/MiyooMini-Ports" title="Miyoo Mini Ports GitHub">GitHub</a>.
        </p>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
