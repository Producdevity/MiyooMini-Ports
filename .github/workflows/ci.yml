name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format and lint (Biome)
        run: pnpm check

      - name: Validate ports.json against the schema
        run: pnpm validate

      - name: Typecheck
        run: pnpm typecheck

      - name: README in sync with ports.json
        run: |
          pnpm gen:readme
          git diff --exit-code README.md

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test
        env:
          GEN_PAGES_TEST_SKIP_BUILD: 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
