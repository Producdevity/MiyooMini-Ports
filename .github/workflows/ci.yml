name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format and lint (Biome)
        run: pnpm check

      - name: Validate ports.json against the schema
        run: pnpm validate

      - name: Typecheck
        run: pnpm typecheck

      # GitHub web edits can't run local hooks; regenerate the table and push
      # it to the branch. Skipped for forks, which lack push access.
      - name: Regenerate README table
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        run: |
          pnpm gen:readme
          if ! git diff --exit-code README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Regenerate README table"
            git push
          fi

      - name: README in sync with ports.json
        run: |
          pnpm gen:readme
          git diff --exit-code README.md

      - name: Build
        run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
