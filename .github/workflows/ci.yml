name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      readme_changed: ${{ steps.readme.outputs.changed }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format and lint (Biome)
        run: pnpm check

      - name: Validate ports.json against the schema
        run: pnpm validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate README
        id: readme
        run: |
          pnpm gen:readme
          if ! git diff --quiet -- README.md; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test
        env:
          GEN_PAGES_TEST_SKIP_BUILD: 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - uses: actions/upload-artifact@v7
        if: steps.readme.outputs.changed == 'true'
        with:
          name: generated-readme
          path: README.md
          if-no-files-found: error

  sync-readme:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.check.outputs.readme_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: generated-readme
          path: ${{ runner.temp }}/generated-readme

      - name: Update generated README on master
        run: bash .github/scripts/sync-readme.sh "$RUNNER_TEMP/generated-readme/README.md"

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
