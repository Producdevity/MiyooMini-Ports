<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porters · Miyoo Mini Ports</title>
    <link rel="stylesheet" href="/style.css" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
  </head>
  <body>
    <header>
      <div class="wrap">
        <p class="kicker">Catalog · Credits</p>
        <h1>Porters</h1>
        <div class="header-sub">
          <p>The people who built the ports in this catalog.</p>
          <a class="nav-link" href="./index.html">← All ports</a>
          <button
            id="theme-toggle"
            class="chip theme-toggle"
            type="button"
            aria-label="Switch color theme"
          >
            Dark
          </button>
        </div>
      </div>
    </header>

    <main class="wrap" id="porters"></main>

    <footer class="site-footer">
      <div class="wrap">
        <p>
          Porters: to add or update your links and bio, edit
          <code>porters.json</code> and
          <a href="https://github.com/Producdevity/MiyooMini-Ports" title="Open a PR on the Miyoo Mini Ports GitHub">open a PR</a>.
        </p>
      </div>
    </footer>

    <script type="module" src="/src/porters.ts"></script>
  </body>
</html>
