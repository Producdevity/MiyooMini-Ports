<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porters · Miyoo Mini Ports</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
  </head>
  <body>
    <a class="skip-link" href="#porters">Skip to content</a>
    <header>
      <div class="wrap">
        <p class="kicker">Catalog · Credits</p>
        <h1>Porters</h1>
        <div class="header-sub">
          <p>The people who built the ports in this catalog.</p>
        </div>
        <nav class="site-nav" id="site-nav" aria-label="Main"></nav>
      </div>
    </header>

    <div class="bar">
      <div class="wrap bar-inner">
        <label class="sr-only" for="porter-search">Search porters</label>
        <input id="porter-search" type="search" placeholder="Search porters" autocomplete="off" />
        <span id="count" class="count" aria-live="polite"></span>
      </div>
    </div>
    <main class="wrap porters-main" id="porters"></main>
    <footer class="site-footer">
      <div class="wrap">
        <p>
          Porters: to add or update your links and bio, edit
          <code>porters.json</code> and open a PR.
        </p>
      </div>
    </footer>

    <script type="module" src="/src/porters.ts"></script>
  </body>
</html>
