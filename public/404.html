<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Not found · Miyoo Mini Ports</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/MiyooMini-Ports/favicon.svg" type="image/svg+xml">
    <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") === "dark" ? "dark" : "light";
    } catch {}
    </script>
    <style>
    :root {
      color-scheme: light;
      --paper: #e8e8e0;
      --ink: #222623;
      --muted: #576158;
      --accent: #b53c20;
      --on-accent: #fffdf5;
      --line: #bec2b8;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #252b27;
      --ink: #f1f1e6;
      --muted: #b7c0b5;
      --accent: #fa9976;
      --on-accent: #251b15;
      --line: #566056;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--paper);
      color: var(--ink);
      font:
        14px / 1.7 system-ui,
        sans-serif;
    }
    header {
      padding: 20px 6vw;
      background: #202522;
      color: #f4f3e8;
      border-bottom: 3px solid #fa7953;
    }
    header a {
      color: inherit;
      display: inline-flex;
      gap: 12px;
      align-items: center;
      text-decoration: none;
      font: 700 18px / 1 monospace;
      text-transform: uppercase;
    }
    header img {
      width: 38px;
      height: 38px;
    }
    main {
      width: min(800px, 100%);
      margin: auto;
      padding: 40px 24px;
    }
    .code {
      display: block;
      font:
        900 clamp(110px, 22vw, 200px) / 0.9 Impact,
        "Arial Narrow",
        sans-serif;
      color: var(--accent);
      letter-spacing: -0.045em;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }
    .label {
      color: var(--muted);
      font: 11px / 1.6 monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 24px 0 10px;
    }
    h1 {
      font:
        800 clamp(32px, 5vw, 48px) / 1.1 system-ui,
        sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      margin: 0 0 18px;
    }
    p {
      color: var(--muted);
      max-width: 450px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 35px;
      color: var(--on-accent);
      background: var(--accent);
      padding: 12px 22px;
      min-height: 48px;
      margin-top: 20px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .back:hover {
      color: var(--paper);
      background: var(--ink);
    }
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }
    </style>
  </head>
  <body>
    <header>
      <a href="/MiyooMini-Ports/"
        ><img src="/MiyooMini-Ports/favicon.svg" alt="">Miyoo Mini Ports</a
      >
    </header>
    <main>
      <span class="code" aria-hidden="true">404_</span>
      <p class="label">Address not found</p>
      <h1>No entry at this address.</h1>
      <p>
        The link may have changed, or this port may have moved. Search the index
        for its current page.
      </p>
      <a class="back" href="/MiyooMini-Ports/"
        >Back to the index <span aria-hidden="true">→</span></a
      >
    </main>
  </body>
</html>
