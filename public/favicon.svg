  <circle cx="177.4" cy="190.4" r="2.1" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="196" cy="210" r="10" fill="#A3271C"/>
  <circle cx="196" cy="210" r="9.2" fill="#E0402E"/>
  <circle cx="193.4" cy="206.4" r="2.1" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="180" cy="226" r="10" fill="#C08A12"/>
  <circle cx="180" cy="226" r="9.2" fill="#F2B31F"/>
  <circle cx="177.4" cy="222.4" r="2.1" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="164" cy="210" r="10" fill="#2E7A38"/>
  <circle cx="164" cy="210" r="9.2" fill="#46A34E"/>
  <circle cx="161.4" cy="206.4" r="2.1" fill="#FFFFFF" fill-opacity="0.55"/>

